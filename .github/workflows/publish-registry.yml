name: Publish schema registry

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build every released schema version
        shell: bash
        env:
          SCHEMA_DOMAIN: ${{ vars.SCHEMA_DOMAIN }}
        run: |
          set -euo pipefail
          rm -rf registry release-source
          while IFS= read -r tag; do
            version="${tag#v}"
            line="v${version%.*}"
            mkdir -p "release-source/$version"
            git archive "$tag" "schemas/$line" | tar -x -C "release-source/$version"
            args=(
              --version "$version"
              --source "release-source/$version/schemas/$line"
              --output registry
              --append
            )
            if [[ -n "${SCHEMA_DOMAIN:-}" ]]; then
              args+=(--domain "$SCHEMA_DOMAIN")
            fi
            node scripts/build-registry.mjs "${args[@]}"
          done < <(git tag --list "v[0-9]*.[0-9]*.[0-9]*" --sort=version:refname)
      - run: npm run validate:registry -- --registry registry
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: registry

  deploy:
    name: Deploy registry
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
